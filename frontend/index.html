<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniRAFT Drawing Board</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #252529;
      --text: #c9c9d4;
      --muted: #55555f;
      --leader: #22c55e;
      --follower: #3b82f6;
      --candidate: #f59e0b;
      --dead: #374151;
      --accent: #818cf8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      display: grid;
      grid-template-rows: 44px 1fr;
      grid-template-columns: 1fr 260px;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    .ws-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dead); transition: background .3s; }
    .dot.ok { background: var(--leader); }
    .dot.err { background: #ef4444; }

    /* ── Canvas area ── */
    #canvas-wrap {
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

    /* ── Toolbar overlay ── */
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(13,13,15,0.88);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      backdrop-filter: blur(6px);
    }

    #toolbar label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    input[type="color"] {
      width: 28px; height: 24px;
      border: 1px solid var(--border);
      background: none; cursor: pointer; border-radius: 4px;
    }

    input[type="range"] { width: 70px; accent-color: var(--accent); }

    #size-val { font-size: 10px; color: var(--muted); width: 24px; }

    .tb-btn {
      padding: 3px 9px;
      background: #1e1e24;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: background .15s;
    }
    .tb-btn:hover { background: #2a2a34; }
    .tb-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Event log overlay ── */
    #event-log {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 340px;
      max-height: 130px;
      overflow-y: auto;
      background: rgba(13,13,15,0.88);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10px;
      color: var(--muted);
      backdrop-filter: blur(6px);
    }

    #event-log .ev { line-height: 1.7; border-bottom: 1px solid #1a1a1e; }
    #event-log .ev:last-child { border: none; }
    #event-log .ev .tag { color: var(--accent); margin-right: 4px; }
    #event-log .ev.warn .tag { color: var(--candidate); }
    #event-log .ev.err .tag { color: #ef4444; }
    #event-log .ev.ok .tag { color: var(--leader); }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sb-section {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sb-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Cluster nodes */
    .node-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      transition: border-color .3s, background .3s;
      background: #0d0d0f;
    }
    .node-card:last-child { margin-bottom: 0; }
    .node-card.leader { border-color: var(--leader); background: rgba(34,197,94,.06); }
    .node-card.candidate { border-color: var(--candidate); background: rgba(245,158,11,.06); }
    .node-card.follower { border-color: var(--follower); background: rgba(59,130,246,.05); }
    .node-card.unreachable { border-color: var(--dead); opacity: .5; }

    .node-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .node-id { font-size: 12px; font-weight: 600; color: #fff; }
    .node-state {
      font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
      padding: 1px 6px; border-radius: 20px;
    }
    .node-card.leader .node-state { background: rgba(34,197,94,.2); color: var(--leader); }
    .node-card.candidate .node-state { background: rgba(245,158,11,.2); color: var(--candidate); }
    .node-card.follower .node-state { background: rgba(59,130,246,.2); color: var(--follower); }
    .node-card.unreachable .node-state { background: #1a1a1e; color: var(--muted); }

    .node-meta { font-size: 10px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .node-meta span { display: flex; gap: 3px; }
    .node-meta .k { color: #3b3b4f; }

    /* Stats */
    .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
    .stat-row .sk { color: var(--muted); }
    .stat-row .sv { color: #fff; font-weight: 600; }

    /* Stroke count bar */
    #stroke-fill { height: 3px; background: var(--accent); width: 0; transition: width .2s; border-radius: 2px; margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>⬡ MiniRAFT Drawing Board</h1>
  <div class="ws-status">
    <span class="dot" id="ws-dot"></span>
    <span id="ws-label">Connecting…</span>
  </div>
</header>

<!-- Canvas -->
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <label>Color</label>
    <input type="color" id="color" value="#1a1a2e" />
    <label>Size</label>
    <input type="range" id="size" min="1" max="30" value="4" />
    <span id="size-val">4</span>
    <button class="tb-btn" id="eraser-btn">Eraser</button>
    <button class="tb-btn" id="clear-btn">Clear</button>
  </div>

  <div id="event-log"></div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sb-section">
    <div class="sb-title">Cluster State</div>
    <div id="nodes"></div>
  </div>

  <div class="sb-section">
    <div class="sb-title">Session Stats</div>
    <div class="stat-row"><span class="sk">Strokes committed</span><span class="sv" id="stat-strokes">0</span></div>
    <div class="stat-row"><span class="sk">Current term</span><span class="sv" id="stat-term">—</span></div>
    <div class="stat-row"><span class="sk">Leader</span><span class="sv" id="stat-leader">—</span></div>
    <div class="stat-row"><span class="sk">Elections</span><span class="sv" id="stat-elections">0</span></div>
    <div id="stroke-fill"></div>
  </div>
</div>

<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Local vector store — all committed strokes kept so resize re-renders correctly.
// Size is stored normalised as a fraction of a 1000px reference width so it
// scales proportionally on any screen size.
const localStrokes = [];

function redrawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of localStrokes) {
    renderLine(
      s.x1 * canvas.width,  s.y1 * canvas.height,
      s.x2 * canvas.width,  s.y2 * canvas.height,
      s.color,
      s.size * canvas.width / 1000
    );
  }
}

function resizeCanvas() {
  const wrap = document.getElementById("canvas-wrap");
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  redrawAll();
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ── Tools ─────────────────────────────────────────────────────────────────────
const colorEl = document.getElementById("color");
const sizeEl = document.getElementById("size");
const sizeVal = document.getElementById("size-val");
const eraserBtn = document.getElementById("eraser-btn");
const clearBtn = document.getElementById("clear-btn");

let erasing = false;
sizeEl.addEventListener("input", () => { sizeVal.textContent = sizeEl.value; });
eraserBtn.addEventListener("click", () => {
  erasing = !erasing;
  eraserBtn.classList.toggle("active", erasing);
  eraserBtn.textContent = erasing ? "Pen" : "Eraser";
});
clearBtn.addEventListener("click", () => {
  // Don't clear locally — wait for the server to broadcast it back,
  // so all clients clear in sync.
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "clear" }));
  }
});

// ── Drawing ───────────────────────────────────────────────────────────────────
let drawing = false, lx = 0, ly = 0;

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return [(src.clientX - r.left) / r.width * canvas.width,
          (src.clientY - r.top) / r.height * canvas.height];
}

canvas.addEventListener("mousedown", (e) => { drawing = true; [lx, ly] = pos(e); });
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); drawing = true; [lx, ly] = pos(e); }, { passive: false });
canvas.addEventListener("mousemove", (e) => { if (drawing) onDraw(e); });
canvas.addEventListener("touchmove", (e) => { e.preventDefault(); if (drawing) onDraw(e); }, { passive: false });
["mouseup","mouseleave","touchend"].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));

function onDraw(e) {
  const [x, y] = pos(e);
  const color = erasing ? "#ffffff" : colorEl.value;
  const size = +sizeEl.value;
  renderLine(lx, ly, x, y, color, size);
  // Normalise size relative to 1000px reference width so it looks consistent
  // on any canvas size (replay, resize, different screen widths)
  const normSize = size / canvas.width * 1000;
  sendStroke({ x1: lx/canvas.width, y1: ly/canvas.height,
               x2: x/canvas.width,  y2: y/canvas.height, color, size: normSize });
  lx = x; ly = y;
}

function renderLine(x1, y1, x2, y2, color, size) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
const wsDot = document.getElementById("ws-dot");
const wsLabel = document.getElementById("ws-label");
let ws, strokeCount = 0, electionCount = 0;
let prevLeader = null;

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:8080`);

  ws.onopen = () => {
    wsDot.className = "dot ok";
    wsLabel.textContent = "Connected";
    addEvent("Connected to gateway", "ok");
  };

  ws.onclose = () => {
    wsDot.className = "dot err";
    wsLabel.textContent = "Reconnecting…";
    addEvent("Gateway disconnected — retrying", "err");
    setTimeout(connect, 1000);
  };

  ws.onerror = () => { wsDot.className = "dot err"; };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "stroke") {
      const s = msg.data;
      localStrokes.push(s); // store in local vector history
      renderLine(s.x1*canvas.width, s.y1*canvas.height,
                 s.x2*canvas.width, s.y2*canvas.height,
                 s.color, s.size * canvas.width / 1000);
      strokeCount++;
      document.getElementById("stat-strokes").textContent = strokeCount;
      const fill = document.getElementById("stroke-fill");
      fill.style.width = Math.min(100, (strokeCount % 50) * 2) + "%";
    }

    // ── FIX 1: Replay committed canvas history when joining mid-session ────
    if (msg.type === "canvas_replay") {
      localStrokes.length = 0;
      for (const s of msg.strokes) localStrokes.push(s);
      redrawAll(); // uses localStrokes + current canvas dimensions
      strokeCount = msg.strokes.length;
      document.getElementById("stat-strokes").textContent = strokeCount;
      addEvent(`Canvas replayed — ${msg.strokes.length} strokes loaded`, "ok");
    }

    if (msg.type === "clear") {
      localStrokes.length = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokeCount = 0;
      document.getElementById("stat-strokes").textContent = 0;
      document.getElementById("stroke-fill").style.width = "0%";
      addEvent("Canvas cleared by a user", "warn");
    }

    if (msg.type === "cluster_state") {
      updateClusterUI(msg.statuses);
    }

    if (msg.type === "error") {
      addEvent("Error: " + msg.message, "err");
    }
  };
}

function sendStroke(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "stroke", data }));
  }
}

// ── Cluster UI ────────────────────────────────────────────────────────────────
function updateClusterUI(statuses) {
  const nodesEl = document.getElementById("nodes");
  const termEl = document.getElementById("stat-term");
  const leaderEl = document.getElementById("stat-leader");

  nodesEl.innerHTML = "";

  let maxTerm = 0;
  let currentLeader = null;

  for (const s of statuses) {
    const stateClass = s.state === "leader" ? "leader"
                     : s.state === "candidate" ? "candidate"
                     : s.state === "follower" ? "follower"
                     : "unreachable";

    const card = document.createElement("div");
    card.className = `node-card ${stateClass}`;
    card.innerHTML = `
      <div class="node-top">
        <span class="node-id">${s.id || s.replica.split("//")[1]}</span>
        <span class="node-state">${s.state || "unreachable"}</span>
      </div>
      <div class="node-meta">
        <span><span class="k">term</span> ${s.term ?? "—"}</span>
        <span><span class="k">log</span> ${s.logLength ?? "—"}</span>
        <span><span class="k">commit</span> ${s.commitIndex ?? "—"}</span>
      </div>`;
    nodesEl.appendChild(card);

    if (s.term > maxTerm) maxTerm = s.term;
    if (s.state === "leader") currentLeader = s.id;
  }

  termEl.textContent = maxTerm || "—";
  leaderEl.textContent = currentLeader || "electing…";

  // Detect leader change
  if (currentLeader && currentLeader !== prevLeader) {
    if (prevLeader !== null) {
      electionCount++;
      document.getElementById("stat-elections").textContent = electionCount;
      addEvent(`New leader elected: ${currentLeader} (term ${maxTerm})`, "ok");
    }
    prevLeader = currentLeader;
  }

  if (!currentLeader && prevLeader !== null) {
    addEvent("Leader lost — election in progress…", "warn");
    prevLeader = null;
  }
}

// ── Event log ─────────────────────────────────────────────────────────────────
const eventLog = document.getElementById("event-log");

function addEvent(msg, type = "") {
  const div = document.createElement("div");
  div.className = `ev ${type}`;
  const t = new Date().toLocaleTimeString("en", { hour12: false });
  div.innerHTML = `<span class="tag">[${t}]</span>${msg}`;
  eventLog.prepend(div);
  while (eventLog.children.length > 40) eventLog.removeChild(eventLog.lastChild);
}

connect();
</script>
</body>
</html>
