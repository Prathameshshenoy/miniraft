<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniRAFT Drawing Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>⬡ MiniRAFT Drawing Board</h1>
  <div class="ws-status">
    <span class="dot" id="ws-dot"></span>
    <span id="ws-label">Connecting…</span>
  </div>
</header>

<!-- Canvas -->
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <label>Color</label>
    <input type="color" id="color" value="#1a1a2e" />
    <label>Size</label>
    <input type="range" id="size" min="1" max="30" value="4" />
    <span id="size-val">4</span>
    <button class="tb-btn" id="eraser-btn">Eraser</button>
    <button class="tb-btn" id="clear-btn">Clear</button>
  </div>

  <div id="event-log"></div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sb-section">
    <div class="sb-title">Cluster State</div>
    <div id="nodes"></div>
  </div>

  <div class="sb-section">
    <div class="sb-title">Session Stats</div>
    <div class="stat-row"><span class="sk">Strokes committed</span><span class="sv" id="stat-strokes">0</span></div>
    <div class="stat-row"><span class="sk">Current term</span><span class="sv" id="stat-term">—</span></div>
    <div class="stat-row"><span class="sk">Leader</span><span class="sv" id="stat-leader">—</span></div>
    <div class="stat-row"><span class="sk">Elections</span><span class="sv" id="stat-elections">0</span></div>
    <div id="stroke-fill"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
