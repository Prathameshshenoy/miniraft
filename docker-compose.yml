version: "3.9"

networks:
  raft-net:
    driver: bridge

x-replica-base: &replica-base
  build: ./replica
  restart: unless-stopped
  networks:
    - raft-net
  volumes:
    - ./replica:/app
    - /app/node_modules

x-replica-healthcheck: &replica-healthcheck
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  replica1:
    <<: *replica-base
    container_name: replica1
    environment:
      - REPLICA_ID=replica1
      - PORT=4001
      - PEERS=http://replica2:4002,http://replica3:4003
    ports:
      - "4001:4001"
    healthcheck:
      <<: *replica-healthcheck
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4001/status" ]

  replica2:
    <<: *replica-base
    container_name: replica2
    environment:
      - REPLICA_ID=replica2
      - PORT=4002
      - PEERS=http://replica1:4001,http://replica3:4003
    ports:
      - "4002:4002"
    healthcheck:
      <<: *replica-healthcheck
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4002/status" ]

  replica3:
    <<: *replica-base
    container_name: replica3
    environment:
      - REPLICA_ID=replica3
      - PORT=4003
      - PEERS=http://replica1:4001,http://replica2:4002
    ports:
      - "4003:4003"
    healthcheck:
      <<: *replica-healthcheck
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4003/status" ]

  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      - REPLICAS=http://replica1:4001,http://replica2:4002,http://replica3:4003
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - raft-net
    ports:
      - "8080:8080"
    # Wait for replicas to be healthy, not just started, so the gateway's
    # first leader-discovery poll doesn't race container startup.
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
      replica3:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - raft-net
    ports:
      - "3000:80"
    depends_on:
      - gateway
