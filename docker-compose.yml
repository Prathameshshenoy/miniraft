version: "3.9"

networks:
  raft-net:
    driver: bridge

services:
  replica1:
    build: ./replica1
    container_name: replica1
    restart: unless-stopped
    environment:
      - REPLICA_ID=replica1
      - PORT=4001
      - PEERS=http://replica2:4002,http://replica3:4003
    volumes:
      - ./replica1:/app
      - /app/node_modules
    networks:
      - raft-net
    ports:
      - "4001:4001"
    # ── FIX 3: Healthcheck ────────────────────────────────────────────────────
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4001/status" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica2:
    build: ./replica2
    container_name: replica2
    restart: unless-stopped
    environment:
      - REPLICA_ID=replica2
      - PORT=4002
      - PEERS=http://replica1:4001,http://replica3:4003
    volumes:
      - ./replica2:/app
      - /app/node_modules
    networks:
      - raft-net
    ports:
      - "4002:4002"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4002/status" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  replica3:
    build: ./replica3
    container_name: replica3
    restart: unless-stopped
    environment:
      - REPLICA_ID=replica3
      - PORT=4003
      - PEERS=http://replica1:4001,http://replica2:4002
    volumes:
      - ./replica3:/app
      - /app/node_modules
    networks:
      - raft-net
    ports:
      - "4003:4003"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://localhost:4003/status" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      - REPLICAS=http://replica1:4001,http://replica2:4002,http://replica3:4003
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - raft-net
    ports:
      - "8080:8080"
    # ── FIX 3: Wait for replicas to be healthy, not just started ──────────────
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
      replica3:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - raft-net
    ports:
      - "3000:80"
    depends_on:
      - gateway
